name: Release builds

# A version tag (v1.2.3) builds the app on each OS and opens a draft release
# with the files attached. Nothing is published until someone publishes the
# draft. Run it by hand (workflow_dispatch) to get the builds as artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
          - os: ubuntu-latest
            name: linux-x64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        shell: bash
        run: |
          python -m pip install -r requirements.txt pyinstaller pillow
          # Linux builds bundle Qt, so the download needs no GTK packages.
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0
            python -m pip install "pywebview[qt]"
          fi
      - name: Unit tests
        run: python -m unittest
      # Each release keeps a snapshot of the settings and history it saves.
      # Later versions are tested against it, so they need a migration to change it.
      - name: Release snapshot
        if: startsWith(github.ref, 'refs/tags/')
        run: python tools/snapshot_release.py --check ${{ github.ref_name }}
      - name: Build
        run: pyinstaller --noconfirm packaging/groundhog-gamma-tuner.spec
      - name: Package
        shell: bash
        run: |
          out="groundhog-gamma-tuner-${{ matrix.name }}"
          case "$RUNNER_OS" in
            Windows) 7z a "$out.zip" "./dist/Groundhog Gamma Tuner" ;;
            macOS) ditto -c -k --keepParent "dist/Groundhog Gamma Tuner.app" "$out.zip" ;;
            Linux) tar -czf "$out.tar.gz" -C dist "Groundhog Gamma Tuner" ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: groundhog-gamma-tuner-${{ matrix.name }}
          path: groundhog-gamma-tuner-${{ matrix.name }}.*

  draft:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Builds for Windows (x64, also runs on Windows on ARM), macOS (Apple silicon), and Linux (x64).

          These builds are not code-signed. Windows SmartScreen may say "Windows protected your PC": choose More info, then Run anyway. macOS may say the app "cannot be opened": right-click it, choose Open, then Open again. Linux: extract the archive and run "Groundhog Gamma Tuner" inside the folder.

          Settings and history live in your user data folder, not next to the app.
          NOTES
          gh release create "$GITHUB_REF_NAME" groundhog-gamma-tuner-* \
            --repo "$GITHUB_REPOSITORY" --draft --title "$GITHUB_REF_NAME" --notes-file notes.md
