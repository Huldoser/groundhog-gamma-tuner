name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Unit tests
        run: python -m coverage run -m unittest
      - name: Coverage
        run: python -m coverage report
      # Linux runs every Windows and macOS path through mocks, so it must reach 100%.
      - name: Full coverage
        if: matrix.os == 'ubuntu-latest'
        run: python -m coverage report --fail-under=100
